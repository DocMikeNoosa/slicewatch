name: Test and release

on:
  push:
    branches: [main]
    paths: ["web/**", "desktop/**", "tests/**", "package.json", "package-lock.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: Web version (test, then publish to GitHub Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: End-to-end test of the web version
        run: npm run e2e:web
      - name: Publish web/ to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web
          publish_branch: gh-pages
          commit_message: "Publish web version from ${{ github.sha }}"

  windows:
    name: Windows app (build, install, test, release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check identifier removal
        run: node tests/scrub.test.js

      - name: Build installer and portable app
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win nsis portable --x64 --publish never

      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop/dist/SliceWatch-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\SliceWatch\SliceWatch.exe'
          if (-not (Test-Path $exe)) { throw "SliceWatch.exe was not installed at $exe" }
          "SLICEWATCH_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installed: $exe"

      - name: End-to-end test of the installed app (three runs, to catch intermittent problems)
        shell: pwsh
        run: |
          npm ci
          foreach ($i in 1..3) {
            $env:SW_DUMP = "diag/run$i"
            npm run e2e:desktop
            if ($LASTEXITCODE -ne 0) { throw "End-to-end run $i failed" }
          }

      - name: Keep diagnostics from a failed test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: diag/

      - uses: actions/upload-artifact@v4
        with:
          name: SliceWatch-windows
          path: |
            desktop/dist/SliceWatch-Setup-*.exe
            desktop/dist/SliceWatch-Portable-*.exe

      - name: Read version
        id: ver
        shell: pwsh
        run: echo "v=$((Get-Content desktop/package.json | ConvertFrom-Json).version)" >> $env:GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: SliceWatch ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows installer and portable app for SliceWatch ${{ steps.ver.outputs.v }}.
            Built, installed and tested end to end on a Windows runner before publishing.
            Windows may show a SmartScreen warning because the app is not code-signed: choose More info, then Run anyway.
            The installed app updates itself from this page; the portable app does not.
          files: |
            desktop/dist/SliceWatch-Setup-*.exe
            desktop/dist/SliceWatch-Setup-*.exe.blockmap
            desktop/dist/SliceWatch-Portable-*.exe
            desktop/dist/latest.yml
